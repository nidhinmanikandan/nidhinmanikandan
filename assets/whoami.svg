<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="whoamiTitle">
  <title id="whoamiTitle">whoami — terminal profile</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f0d"/>
      <stop offset="55%" stop-color="#07090a"/>
      <stop offset="100%" stop-color="#050605"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <line x1="0" y1="3.5" x2="4" y2="3.5" stroke="#00FF66" stroke-width="0.5" opacity="0.05"/>
    </pattern>

    <clipPath id="panelClip">
      <rect x="6" y="6" width="748" height="528" rx="12"/>
    </clipPath>

    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="borderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <style>
      .blink { animation: blink 1.1s steps(1, end) infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .pulseSlow { animation: pulseSlow 3.6s ease-in-out infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
      @keyframes pulseSlow { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .pulse, .pulseSlow { animation: none; opacity: 1; }
      }
      text { dominant-baseline: alphabetic; }
    </style>
  </defs>

  <!-- background panel -->
  <g clip-path="url(#panelClip)">
    <rect x="6" y="6" width="748" height="528" fill="url(#bgGrad)"/>
    <rect x="6" y="6" width="748" height="528" fill="url(#scanlines)"/>
  </g>

  <!-- outer glow + crisp border -->
  <rect x="6" y="6" width="748" height="528" rx="12" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.45" filter="url(#borderGlow)" class="pulseSlow"/>
  <rect x="6" y="6" width="748" height="528" rx="12" fill="none" stroke="#00FF66" stroke-width="1.2" opacity="0.85"/>

  <!-- corner reticle marks -->
  <g stroke="#00FF66" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M0,18 L0,0 L18,0" fill="none"/>
    <path d="M742,0 L760,0 L760,18" fill="none"/>
    <path d="M760,522 L760,540 L742,540" fill="none"/>
    <path d="M18,540 L0,540 L0,522" fill="none"/>
  </g>

  <!-- title bar -->
  <circle cx="28" cy="27" r="4" fill="none" stroke="#4a4f4c" stroke-width="1"/>
  <circle cx="46" cy="27" r="4" fill="none" stroke="#4a4f4c" stroke-width="1"/>
  <circle cx="64" cy="27" r="4" fill="#00FF66" opacity="0.85" filter="url(#neonGlow)"/>

  <text x="380" y="31" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8a908c">whoami.sh</text>

  <circle cx="706" cy="27" r="3.5" fill="#00FF66" filter="url(#neonGlow)" class="pulse"/>
  <text x="716" y="31" font-size="9.5" letter-spacing="1" fill="#7fdba0">SYSTEM ONLINE</text>

  <line x1="16" y1="48" x2="744" y2="48" stroke="#00FF66" stroke-width="1" opacity="0.25"/>

  <!-- prompt -->
  <text x="34" y="88" font-size="14.5" fill="#00FF66" filter="url(#neonGlow)">┌── nidhin@github ── ~/profile</text>
  <text x="34" y="110" font-size="14.5" fill="#00FF66" filter="url(#neonGlow)">└─$ cat about.txt</text>

  <!-- paragraph 1 -->
  <g font-size="14" fill="#c7cccb">
    <text x="34" y="146">I'm a Computer Science Engineering student who builds products</text>
    <text x="34" y="168">at the intersection of clean interfaces and intelligent systems.</text>
    <text x="34" y="190">I like taking a complicated idea and cutting it down until it's</text>
    <text x="34" y="212">simple enough to actually use — then making that simple version</text>
    <text x="34" y="234">feel good to look at.</text>
  </g>

  <!-- paragraph 2 -->
  <g font-size="14" fill="#c7cccb">
    <text x="34" y="270">Most of what I build lives somewhere between frontend engineering</text>
    <text x="34" y="292">and UI/UX design, with a growing pull toward AI-powered tools that</text>
    <text x="34" y="314">make learning and building easier for other people.</text>
  </g>

  <!-- status list -->
  <g font-size="14">
    <text x="34" y="350" fill="#00FF66" filter="url(#neonGlow)">[OK]</text>
    <text x="140" y="350" fill="#c7cccb">Computer Science Engineering student</text>

    <text x="34" y="372" fill="#00FF66" filter="url(#neonGlow)">[OK]</text>
    <text x="140" y="372" fill="#c7cccb">Frontend development &amp; UI engineering</text>

    <text x="34" y="394" fill="#00FF66" filter="url(#neonGlow)">[OK]</text>
    <text x="140" y="394" fill="#c7cccb">UI/UX design — clean, modern interfaces</text>

    <text x="34" y="416" fill="#00FF66" filter="url(#neonGlow)" class="pulse">[RUNNING]</text>
    <text x="140" y="416" fill="#c7cccb">Exploring AI-powered applications &amp; dev tools</text>

    <text x="34" y="438" fill="#00FF66" filter="url(#neonGlow)" class="pulse">[BUILDING]</text>
    <text x="140" y="438" fill="#c7cccb">AI Growth — an AI-powered learning roadmap platform</text>

    <text x="34" y="460" fill="#00FF66" filter="url(#neonGlow)" class="pulseSlow">[ALWAYS_ON]</text>
    <text x="140" y="460" fill="#c7cccb">Learning new tools, sharpening the old ones</text>
  </g>

  <!-- closing prompt with blinking cursor -->
  <text x="34" y="496" font-size="14.5" fill="#00FF66" filter="url(#neonGlow)">└─$</text>
  <rect x="60" y="483" width="8" height="15" fill="#00FF66" filter="url(#neonGlow)" class="blink"/>
</svg>
